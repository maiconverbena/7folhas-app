
<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>7 Folhas - Login</title>
</head>
<body style="font-family: Arial; text-align: center; margin-top: 50px;">

  <h1>🌿 Comunidade 7 Folhas</h1>

  <h2>Login</h2>

  <input id="email" placeholder="Email"><br><br>
  <input id="password" type="password" placeholder="Senha"><br><br>

  <button onclick="login()">Entrar</button>

  <h3>ou</h3>

  <button onclick="register()">Criar conta</button>

  <p id="msg"></p>

<script>
const API = "https://backend-7folhas-1.onrender.com";

async function register() {
  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;

  const res = await fetch(API + "/register", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({ email, password })
  });

  const data = await res.json();
  document.getElementById("msg").innerText = data.message || data.error;
}

async function login() {
  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;

  const res = await fetch(API + "/login", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({ email, password })
  });

  const data = await res.json();

  if (data.token) {
    localStorage.setItem("token", data.token);
    document.getElementById("msg").innerText = "Login realizado!";
  } else {
    document.getElementById("msg").innerText = data.error;
  }
}
</script>

</body>
</html>
